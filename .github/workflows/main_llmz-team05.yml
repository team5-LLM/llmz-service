# https://github.com/Azure/webapps-deploy
# 모노레포: backend/ 만 wwwroot에 배포 (시작 명령: uvicorn app.main:app)

name: Build and deploy Python app to Azure Web App - llmz-team05

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/main_llmz-team05.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (CI 검증 — venv는 배포 artifact에 포함하지 않음)
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: backend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D108764442D6457692B729601ABA49CC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2917BF161AF34A0A855B8A978ADCB552 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8B56AA32391A40CB8039B75E8ECD18BD }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: llmz-team05
          slot-name: Production
