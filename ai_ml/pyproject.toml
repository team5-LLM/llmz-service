[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmz-ai-ml"
version = "0.1.0"
description = "AI/ML privacy pipeline for LLMZ service"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scikit-learn",
    "openai",
]

[tool.setuptools]
packages = ["ai_ml"]

[tool.setuptools.package-dir]
ai_ml = "src"